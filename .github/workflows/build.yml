name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [aether, vinery, meadow, rubber, spectrum]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build ${{ matrix.module }}
        id: build
        run: |
          chmod +x gradlew
          ./gradlew -p "mods/${{ matrix.module }}" build --no-daemon
          MOD_ID=$(grep -m1 '^mod_id=' "mods/${{ matrix.module }}/gradle.properties" | cut -d= -f2)
          MOD_VERSION=$(grep -m1 '^mod_version=' "mods/${{ matrix.module }}/gradle.properties" | cut -d= -f2)
          JAR="mods/${{ matrix.module }}/build/libs/${MOD_ID}-${MOD_VERSION}.jar"
          test -f "$JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.jar }}
          archive: false
          if-no-files-found: error
