name: Sync Modrinth Descriptions

# Push README.md bodies to Modrinth without uploading a new version.
on:
  workflow_dispatch:
    inputs:
      module:
        description: Module to sync (or all)
        required: true
        default: all
        type: choice
        options:
          - all
          - aether
          - vinery
          - meadow
          - rubber
          - spectrum
          - betterend

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ github.event.inputs.module == 'all' && fromJson('["aether","vinery","meadow","rubber","spectrum","betterend"]') || fromJson(format('["{0}"]', github.event.inputs.module)) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Sync ${{ matrix.module }} README to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "MODRINTH_TOKEN secret is not set (needs PROJECT_WRITE)"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew ":${{ matrix.module }}:modrinthSyncBody" --no-daemon
