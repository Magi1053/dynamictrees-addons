name: Create BetterEnd Modrinth Project

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Optional existing Modrinth project id (skips create)"
        required: false
        type: string

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create Modrinth project if missing
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          INPUT_PROJECT_ID: ${{ inputs.project_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MODRINTH_TOKEN:-}" ]; then
            echo "MODRINTH_TOKEN missing"
            exit 1
          fi
          UA="skcraft-dynamictrees-addons (github.com/Magi1053/dynamictrees-addons)"
          # Do not use printf '%s' with an unescaped token — tokens can contain '%' and break the header.
          TOKEN_LEN=${#MODRINTH_TOKEN}
          TOKEN_PREFIX=${MODRINTH_TOKEN:0:4}
          echo "MODRINTH_TOKEN length=$TOKEN_LEN prefix=$TOKEN_PREFIX"
          if [[ "$MODRINTH_TOKEN" == *$'\n'* ]] || [[ "$MODRINTH_TOKEN" == *$'\r'* ]]; then
            echo "WARNING: MODRINTH_TOKEN contains CR/LF; trimming"
            MODRINTH_TOKEN="${MODRINTH_TOKEN//$'\r'/}"
            MODRINTH_TOKEN="${MODRINTH_TOKEN//$'\n'/}"
          fi
          if [[ "$MODRINTH_TOKEN" == Bearer\ * ]]; then
            echo "WARNING: stripping Bearer prefix from MODRINTH_TOKEN"
            MODRINTH_TOKEN="${MODRINTH_TOKEN#Bearer }"
          fi

          # Note: GET /user needs USER_READ; our publish PAT may only have VERSION_CREATE + PROJECT_WRITE.
          # Skip /user validation and attempt create (needs PROJECT_CREATE) or accept an input project id.

          if [ -n "${INPUT_PROJECT_ID:-}" ]; then
            PROJECT_ID="$INPUT_PROJECT_ID"
            echo "Using workflow input project id: $PROJECT_ID"
          else
            EXISTING_CODE=$(curl -sS -o /tmp/existing.json -w "%{http_code}" \
              -H "Authorization: ${MODRINTH_TOKEN}" \
              -H "User-Agent: ${UA}" \
              "https://api.modrinth.com/v2/project/dtbetterend" || true)
            echo "GET /project/dtbetterend -> HTTP $EXISTING_CODE"
            if [ "$EXISTING_CODE" = "200" ]; then
              PROJECT_ID=$(jq -r .id /tmp/existing.json)
              echo "Project already exists: $PROJECT_ID"
            else
              jq -n \
                --arg body "$(cat mods/betterend/README.md)" \
                '{
                  slug: "dtbetterend",
                  title: "Dynamic Trees for BetterEnd",
                  description: "Dynamic Trees compatibility for BetterEnd End trees.",
                  categories: ["worldgen","adventure","game-mechanics"],
                  client_side: "required",
                  server_side: "required",
                  body: $body,
                  status: "draft",
                  requested_status: "unlisted",
                  project_type: "mod",
                  license_id: "MIT",
                  is_draft: true,
                  initial_versions: [],
                  source_url: "https://github.com/Magi1053/dynamictrees-addons/tree/main/mods/betterend",
                  issues_url: "https://github.com/Magi1053/dynamictrees-addons/issues"
                }' > /tmp/project.json
              CREATE_CODE=$(curl -sS -o /tmp/created.json -w "%{http_code}" -X POST \
                "https://api.modrinth.com/v2/project" \
                -H "Authorization: ${MODRINTH_TOKEN}" \
                -H "User-Agent: ${UA}" \
                -F "data=@/tmp/project.json;type=application/json" || true)
              echo "POST /project -> HTTP $CREATE_CODE"
              cat /tmp/created.json || true
              echo
              if [ "$CREATE_CODE" != "200" ]; then
                echo "::error::Modrinth project create failed (HTTP $CREATE_CODE)."
                echo "PAT needs PROJECT_CREATE (and usually PROJECT_WRITE). Or create the project in the Modrinth UI under Viberanium, then re-run this workflow with project_id filled in."
                exit 1
              fi
              PROJECT_ID=$(jq -r .id /tmp/created.json)
            fi
          fi
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "PROJECT_ID empty"
            exit 1
          fi
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
      - name: Write project id into gradle.properties
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/^modrinth_project_id=.*/modrinth_project_id=${PROJECT_ID}/" mods/betterend/gradle.properties
          grep '^modrinth_project_id=' mods/betterend/gradle.properties
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(betterend): set Modrinth project id"
          file_pattern: mods/betterend/gradle.properties
