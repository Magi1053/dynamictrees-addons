name: Publish Modrinth

# Tags-only workflow (do not combine with branches: — that prevents tag triggers).
on:
  push:
    tags:
      - "**"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Resolve module from tag
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          MODULE="${TAG%%/*}"
          VERSION="${TAG#*/v}"
          case "$MODULE" in
            aether|vinery|meadow|rubber|spectrum) ;;
            *) echo "Unknown module in tag: $TAG (expected <module>/v<version>)"; exit 1 ;;
          esac
          if [[ "$TAG" != "$MODULE/v$VERSION" ]]; then
            echo "Tag must look like $MODULE/v<version>, got: $TAG"
            exit 1
          fi
          PROP_VERSION=$(grep -m1 '^mod_version=' "mods/$MODULE/gradle.properties" | cut -d= -f2)
          if [ "$PROP_VERSION" != "$VERSION" ]; then
            echo "Tag version $VERSION does not match mods/$MODULE mod_version=$PROP_VERSION"
            exit 1
          fi
          PROJECT_ID=$(grep -m1 '^modrinth_project_id=' "mods/$MODULE/gradle.properties" | cut -d= -f2-)
          if [ -z "$PROJECT_ID" ]; then
            echo "modrinth_project_id is empty in mods/$MODULE/gradle.properties"
            exit 1
          fi
          MOD_ID=$(grep -m1 '^mod_id=' "mods/$MODULE/gradle.properties" | cut -d= -f2)
          MC_VERSION=$(grep -m1 '^minecraft_version=' gradle.properties | cut -d= -f2)

          if ! grep -qE "^## ${VERSION}( |$)" "mods/$MODULE/CHANGELOG.md"; then
            echo "mods/$MODULE/CHANGELOG.md is missing a '## $VERSION' section for the Modrinth version changelog"
            exit 1
          fi

          echo "module=$MODULE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "mod_id=$MOD_ID" >> "$GITHUB_OUTPUT"
          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish ${{ steps.meta.outputs.module }} to Modrinth
        id: publish
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "MODRINTH_TOKEN secret is not set"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew ":${{ steps.meta.outputs.module }}:build" ":${{ steps.meta.outputs.module }}:modrinth" ":${{ steps.meta.outputs.module }}:modrinthSyncBody" --no-daemon
          JAR="mods/${{ steps.meta.outputs.module }}/build/libs/${{ steps.meta.outputs.mod_id }}-neoforge-${{ steps.meta.outputs.mc_version }}-${{ steps.meta.outputs.version }}.jar"
          test -f "$JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.publish.outputs.jar }}
          archive: false
          if-no-files-found: error
