plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'com.modrinth.minotaur'
}

dependencies {
    compileOnly 'maven.modrinth:dynamictrees:1.7.2'
    compileOnly 'maven.modrinth:emi:1.1.24+1.21.1+neoforge'
    compileOnly 'maven.modrinth:revelationary:1.5.0+1.21.1'
    compileOnly 'maven.modrinth:spectrum:1.11.9-1.21.1-neo'
}

modrinth {
    dependencies {
        required.project 'dynamictrees'
        required.project 'spectrum'
        required.project 'revelationary'
        optional.project 'emi'
    }
}
