plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'com.modrinth.minotaur'
}

dependencies {
    compileOnly 'maven.modrinth:dynamictrees:1.7.2'
    compileOnly 'maven.modrinth:emi:1.1.24+1.21.1+neoforge'
    runtimeOnly 'meadow.neoforge:letsdo-meadow-neoforge:1.4.9'
    runtimeOnly 'maven.modrinth:architectury-api:13.0.11+neoforge'
}

modrinth {
    dependencies {
        required.project 'dynamictrees'
        optional.project 'emi'
    }
}
