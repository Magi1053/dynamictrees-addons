plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'com.modrinth.minotaur'
}

neoForge {
    mods {
        dtaether {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            systemProperty 'forge.logging.console.level', 'info'
            if (findProperty('smokeQuickPlay')) {
                programArgument '--quickPlaySingleplayer'
                programArgument smokeQuickPlay.toString()
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.logging.console.level', 'info'
        }
    }
}

dependencies {
    compileOnly 'maven.modrinth:dynamictrees:1.7.2'
    compileOnly 'maven.modrinth:emi:1.1.24+1.21.1+neoforge'

    // Dev client runtime. Accessories is top-level so Aether's JiJ copy does not break MDG runs.
    runtimeOnly 'maven.modrinth:dynamictrees:1.7.2'
    runtimeOnly 'maven.modrinth:aether:1.21.1-1.5.10-neoforge'
    runtimeOnly 'maven.modrinth:owo-lib:0.12.15.5-beta.1+1.21'
    runtimeOnly 'maven.modrinth:accessories:1.1.0-beta.53+1.21.1'
    // Optional Deep Aether (JiJ brings NeoForge TerraBlender). Toggle: -PwithDeepAether=true|false
    if (findProperty('withDeepAether') != 'false') {
        runtimeOnly 'maven.modrinth:deep-aether:1.21.1-1.1.5.1'
    }
}

modrinth {
    dependencies {
        required.project 'dynamictrees'
        required.project 'aether'
        optional.project 'deep-aether'
        optional.project 'emi'
    }
}
